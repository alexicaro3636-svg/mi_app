name: mi_app_bt
description: App de telemetría SOMI

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bluetooth_serial_plus: ^0.5.1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

  # 🔥 PDF y exportación
  pdf: ^3.11.0
  printing: ^5.13.4
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"